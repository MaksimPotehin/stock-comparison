<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#0F1A2B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00BFF5"/>
      <stop offset="100%" stop-color="#38E8A5"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative grid -->
  <g opacity="0.2">
    <g stroke="#1E2A43" stroke-width="1">
      <line x1="0" y1="90" x2="1200" y2="90"/>
      <line x1="0" y1="180" x2="1200" y2="180"/>
      <line x1="0" y1="270" x2="1200" y2="270"/>
      <line x1="0" y1="360" x2="1200" y2="360"/>
      <line x1="0" y1="450" x2="1200" y2="450"/>
      <line x1="0" y1="540" x2="1200" y2="540"/>
    </g>
    <g stroke="#1E2A43" stroke-width="1">
      <line x1="150" y1="0" x2="150" y2="630"/>
      <line x1="300" y1="0" x2="300" y2="630"/>
      <line x1="450" y1="0" x2="450" y2="630"/>
      <line x1="600" y1="0" x2="600" y2="630"/>
      <line x1="750" y1="0" x2="750" y2="630"/>
      <line x1="900" y1="0" x2="900" y2="630"/>
      <line x1="1050" y1="0" x2="1050" y2="630"/>
    </g>
  </g>

  <!-- Soft accent shapes -->
  <circle cx="1060" cy="140" r="140" fill="url(#accent)" opacity="0.35" filter="url(#soft)"/>
  <circle cx="140" cy="520" r="130" fill="url(#accent)" opacity="0.25" filter="url(#soft)"/>

  <!-- Title -->
  <text x="80" y="270" fill="#E6F4FF" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, 'Helvetica Neue', Arial, 'Noto Sans', 'Segoe UI Symbol'" font-weight="800" font-size="64">
    Free Investment Calculator
  </text>

  <!-- Subtitle -->
  <text x="80" y="330" fill="#9FB5D1" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, 'Helvetica Neue', Arial, 'Noto Sans', 'Segoe UI Symbol'" font-weight="500" font-size="28">
    Compound Interest • Monthly Contributions • Charts & Tables
  </text>

  <!-- Simple chart motif -->
  <g transform="translate(80,380)">
    <rect x="0" y="0" width="520" height="140" rx="12" fill="#0E1A2C" stroke="#19324F"/>
    <polyline points="20,110 100,100 180,90 260,75 340,55 420,35 500,20" fill="none" stroke="url(#accent)" stroke-width="4"/>
    <circle cx="500" cy="20" r="5" fill="#00BFF5"/>
  </g>

  <!-- Brand -->
  <text x="80" y="570" fill="#7FA4C6" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, 'Helvetica Neue', Arial, 'Noto Sans', 'Segoe UI Symbol'" font-weight="600" font-size="20">
    investing-space.tech
  </text>
</svg>
<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1F2937"/>
  
  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00BFF5;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#00BFF5;stop-opacity:0.05"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#gradient1)"/>
  
  <!-- Logo area -->
  <rect x="60" y="60" width="60" height="60" rx="8" fill="#00BFF5"/>
  <text x="90" y="105" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1F2937" text-anchor="middle">IS</text>
  
  <!-- Main title -->
  <text x="150" y="105" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#FFFFFF">Investing Space</text>
  
  <!-- Subtitle -->
  <text x="60" y="200" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#00BFF5">Investment Calculator</text>
  
  <!-- Description -->
  <text x="60" y="260" font-family="Arial, sans-serif" font-size="24" fill="#D1D5DB">Calculate compound interest and plan your investments</text>
  <text x="60" y="300" font-family="Arial, sans-serif" font-size="24" fill="#D1D5DB">Free online tool for financial planning</text>
  
  <!-- Features -->
  <g transform="translate(60, 360)">
    <!-- Feature 1 -->
    <circle cx="15" cy="15" r="6" fill="#00BFF5"/>
    <text x="35" y="20" font-family="Arial, sans-serif" font-size="18" fill="#FFFFFF">Compound Interest Calculations</text>
    
    <!-- Feature 2 -->
    <circle cx="15" cy="50" r="6" fill="#00BFF5"/>
    <text x="35" y="55" font-family="Arial, sans-serif" font-size="18" fill="#FFFFFF">Regular Contribution Modeling</text>
    
    <!-- Feature 3 -->
    <circle cx="15" cy="85" r="6" fill="#00BFF5"/>
    <text x="35" y="90" font-family="Arial, sans-serif" font-size="18" fill="#FFFFFF">Interactive Charts &amp; Tables</text>
  </g>
  
  <!-- Chart visual -->
  <g transform="translate(700, 200)">
    <!-- Chart background -->
    <rect x="0" y="0" width="440" height="280" rx="12" fill="#374151" stroke="#00BFF5" stroke-width="2"/>
    
    <!-- Chart lines -->
    <polyline points="40,240 100,220 160,180 220,120 280,80 340,40 400,20" 
              fill="none" stroke="#00BFF5" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Data points -->
    <circle cx="40" cy="240" r="4" fill="#00BFF5"/>
    <circle cx="100" cy="220" r="4" fill="#00BFF5"/>
    <circle cx="160" cy="180" r="4" fill="#00BFF5"/>
    <circle cx="220" cy="120" r="4" fill="#00BFF5"/>
    <circle cx="280" cy="80" r="4" fill="#00BFF5"/>
    <circle cx="340" cy="40" r="4" fill="#00BFF5"/>
    <circle cx="400" cy="20" r="4" fill="#00BFF5"/>
    
    <!-- Chart labels -->
    <text x="220" y="270" font-family="Arial, sans-serif" font-size="14" fill="#9CA3AF" text-anchor="middle">Investment Growth Over Time</text>
  </g>
  
  <!-- Bottom URL -->
  <text x="600" y="580" font-family="Arial, sans-serif" font-size="20" fill="#9CA3AF" text-anchor="middle">investing-space.tech</text>
</svg> 